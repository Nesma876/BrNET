name: Verify archived results

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Recompute frozen OOF comparisons
        run: python scripts/verify_frozen_results.py
      - name: Recompute revision uncertainty and pHash sensitivity
        run: python scripts/bootstrap_revision_uncertainty.py
